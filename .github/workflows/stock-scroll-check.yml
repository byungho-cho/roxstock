name: Stock Scroll Restoration Check
on:
  pull_request:
    branches: [main]
    paths:
      - frontend/tests/targets/stock-scroll-restoration.spec.ts
      - frontend/tests/targets/stock-input-fixture.ts
      - frontend/src/hooks/navigation/**
      - frontend/src/pages/stocks/StockListPage.tsx
      - frontend/src/pages/stocks/LiveStockDetailPage.tsx
      - frontend/src/pages/stocks/LiveStockInsightPage.tsx
      - .github/workflows/stock-scroll-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-scroll-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  restoration:
    # Value-analysis and compound-plan deliveries request functional checks only; regression QA is separate.
    if: github.head_ref != 'codex/value-analysis-v04-20261005' && github.head_ref != 'codex/compound-value-v04-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache/restore@v4
        id: passed
        with:
          path: ${{ runner.temp }}/stock-scroll-passed
          key: stock-scroll-node20-v1-${{ hashFiles('frontend/src/**', 'frontend/tests/targets/stock-scroll-restoration.spec.ts', 'frontend/tests/targets/stock-input-fixture.ts', 'frontend/playwright.targets.config.ts', 'frontend/package.json', 'package-lock.json', '.github/workflows/stock-scroll-check.yml') }}
      - if: steps.passed.outputs.cache-hit != 'true'
        run: npm ci --workspace frontend --include-workspace-root=false
      - if: steps.passed.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Check three classifications with real scrolling
        if: steps.passed.outputs.cache-hit != 'true'
        run: npx playwright test --config=playwright.targets.config.ts stock-scroll-restoration.spec.ts --project=cover-370x465 --project=tablet-725x396 --workers=2
        working-directory: frontend
      - if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p "${{ runner.temp }}/stock-scroll-passed" && git rev-parse HEAD > "${{ runner.temp }}/stock-scroll-passed/passed"
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/stock-scroll-passed
          key: stock-scroll-node20-v1-${{ hashFiles('frontend/src/**', 'frontend/tests/targets/stock-scroll-restoration.spec.ts', 'frontend/tests/targets/stock-input-fixture.ts', 'frontend/playwright.targets.config.ts', 'frontend/package.json', 'package-lock.json', '.github/workflows/stock-scroll-check.yml') }}
      - name: Record execution
        if: always()
        run: |
          echo "SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: $GITHUB_RUN_ID; reused: ${{ steps.passed.outputs.cache-hit }}; status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.passed.outputs.cache-hit != 'true'
        with:
          name: stock-scroll-evidence
          path: |
            frontend/test-results/targets/
            frontend/playwright-targets-report/
          retention-days: 7
