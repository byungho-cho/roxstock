name: Phase23 Management and Exclusions
on:
  pull_request:
    branches: [main]
    paths: [frontend/**, backend/**, database/**, .github/workflows/phase23-check.yml]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Build current main baseline
        run: |
          git worktree add --detach phase23-baseline 29a5c6062932717fb15880d52d52d170b8ceca9a
          ln -s ../node_modules phase23-baseline/node_modules
          ln -s ../../frontend/node_modules phase23-baseline/frontend/node_modules
          VITE_DATA_SOURCE=api npm --prefix phase23-baseline/frontend run build
      - run: VITE_DATA_SOURCE=api npm run build:frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.phase23.config.ts
        working-directory: frontend
      - run: npx playwright test --config playwright.security-v06.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase23-screen-evidence
          path: |
            frontend/test-results/phase23/
            frontend/test-results/security-v06/
          retention-days: 30
