name: Phase31 Loading and Version
on:
  pull_request:
    branches: [main]
    paths: [frontend/**, backend/**, scripts/release-version.mjs, .github/workflows/phase31-check.yml]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: node scripts/release-version.mjs
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.phase31.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase31-evidence
          path: frontend/test-results/phase31/
