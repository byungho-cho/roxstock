name: Collector Split Check
on:
  pull_request:
    paths:
      - 'collector/**'
      - 'shared/**'
      - 'database/**'
      - 'backend/Dockerfile'
      - 'package*.json'
      - 'scripts/deploy*'
      - 'scripts/smoke-collector-image.sh'
      - '.github/workflows/collector-check.yml'
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck:collector && npm run build:collector
      - run: npm --workspace shared test && npm --workspace collector test
      - run: node --test scripts/tests/service-boundaries.test.mjs scripts/tests/deployment-scope.test.mjs
      - name: API image contains no collector execution engine
        run: |
          docker build -f backend/Dockerfile -t roxstock-api-check .
          docker run --rm --entrypoint sh roxstock-api-check -c 'test ! -d /app/collector/dist; test ! -d /app/backend/dist/collector'
          docker run -d --name api-entry-check --network none -e DATABASE_URL=mysql://ci:ci@127.0.0.1:3306/ci roxstock-api-check
          sleep 5
          docker exec api-entry-check node -e "fetch('http://127.0.0.1:3300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker stop -t 30 api-entry-check
          test "$(docker inspect --format '{{.State.ExitCode}}' api-entry-check)" = 0
      - name: Independent collector image and all three real entrypoints
        run: |
          docker build -f collector/Dockerfile -t roxstock-collector-check .
          bash scripts/smoke-collector-image.sh roxstock-collector-check
