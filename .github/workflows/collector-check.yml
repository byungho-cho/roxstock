name: Collector Split Check
on:
  pull_request:
    paths:
      - 'collector/**'
      - 'shared/**'
      - 'database/**'
      - 'backend/Dockerfile'
      - 'package*.json'
      - 'scripts/deploy*'
      - 'scripts/smoke-collector-image.sh'
      - '.github/workflows/collector-check.yml'
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci_phase16_test
    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ci_phase16_test
          MARIADB_USER: ci
          MARIADB_PASSWORD: ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - name: Collector DB storage, leases and durable manual queue compatibility
        run: |
          node --import tsx --test --test-concurrency=1 collector/tests/realtime-lifecycle.integration.ts collector/tests/independent-supplement.integration.ts backend/tests/manual-collector.integration.ts backend/tests/manual-independent.integration.ts
      - name: DART receipt storage and recovery in a separate fixture database
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/roxstock_dart_recovery_test
        run: |
          node --import tsx backend/tests/prepare-dart-recovery.ts
          node --import tsx --test --test-concurrency=1 collector/tests/dart-recovery.integration.ts collector/tests/dart-source-validation.integration.ts
      - run: npm run typecheck:collector && npm run build:collector
      - run: npm --workspace shared test && npm --workspace collector test
      - run: node --test scripts/tests/service-boundaries.test.mjs scripts/tests/deployment-scope.test.mjs
      - name: API image contains no collector execution engine
        run: |
          docker build -f backend/Dockerfile -t roxstock-api-check .
          docker run --rm --entrypoint sh roxstock-api-check -c 'test ! -d /app/collector/dist; test ! -d /app/backend/dist/collector'
          docker run -d --name api-entry-check --network none -e DATABASE_URL=mysql://ci:ci@127.0.0.1:3306/ci roxstock-api-check
          sleep 5
          docker exec api-entry-check node -e "fetch('http://127.0.0.1:3300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker stop -t 30 api-entry-check
          test "$(docker inspect --format '{{.State.ExitCode}}' api-entry-check)" = 0
      - name: Independent collector image and all three real entrypoints
        run: |
          docker build -f collector/Dockerfile -t roxstock-collector-check .
          bash scripts/smoke-collector-image.sh roxstock-collector-check
      - name: Real Compose independent deployment preserves counterpart containers
        env:
          VERIFICATION_DB_CONTAINER: ${{ job.services.mariadb.id }}
        run: bash scripts/smoke-service-isolation.sh
