name: Investment Profit v0.4 Function Check
on:
  pull_request:
    branches: [main]
    paths:
      - frontend/src/pages/investment-profit/**
      - frontend/tests/targets/profit-v04.spec.ts
      - .github/workflows/profit-function-check.yml
permissions:
  contents: read
concurrency:
  group: profit-v04-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache/restore@v4
        id: passed
        with:
          path: ${{ runner.temp }}/profit-v04-passed
          key: profit-v04-v1-${{ hashFiles('frontend/src/**', 'frontend/tests/targets/profit-v04.spec.ts', 'frontend/playwright.targets.config.ts', 'frontend/package.json', 'package-lock.json', '.github/workflows/profit-function-check.yml') }}
      - if: steps.passed.outputs.cache-hit != 'true'
        run: npm ci --workspace frontend --include-workspace-root=false
      - if: steps.passed.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Preserve passing cases when only related inputs change
        id: scope
        shell: bash
        run: |
          verified=800a4dcf86555ac68a5f3f27945fdd05b71b155e
          # Run 37248410867 passed all account/state/navigation/aggregation cases.
          # The two geometry failures measured the hidden cover menu on tablet.
          # Only permit the reviewed type/column/map changes and visible-menu test correction.
          if git diff --quiet "$verified" HEAD -- frontend/src ':!frontend/src/pages/investment-profit' frontend/public frontend/playwright.targets.config.ts frontend/package.json package.json package-lock.json && node --input-type=commonjs <<'NODE'
          const fs = require('fs'), { execFileSync } = require('child_process');
          const base = '800a4dcf86555ac68a5f3f27945fdd05b71b155e';
          const check = (path, changes) => {
            let expected = execFileSync('git', ['show', `${base}:${path}`], { encoding: 'utf8' });
            for (const [from, to] of changes) expected = expected.replace(from, to);
            if (expected !== fs.readFileSync(path, 'utf8')) process.exit(1);
          };
          check('frontend/src/pages/investment-profit/profitData.ts', [["    map.set(id, [...(map.get(id) ?? []), row]);", "    const rows = map.get(id) ?? [];\n    rows.push(row);\n    map.set(id, rows);"]]);
          check('frontend/src/pages/investment-profit/InvestmentProfitPage.tsx', [
            ["const annualColumns = '40px minmax(0, 1fr) 64px minmax(0, 1.25fr)';\nconst columns = 'minmax(0, 1fr) 64px minmax(0, 1.35fr)';", "// A shared amount column keeps the summary percentage edge identical across tabs and details.\nconst annualColumns = '40px minmax(0, 1fr) 64px minmax(0, 40%)';\nconst columns = 'minmax(0, 1fr) 64px minmax(0, 40%)';"],
            ["function Value(", "type CompactRow = { id: string; label: string; value: bigint | null; cost?: bigint | null; middle?: string };\nfunction Value("],
            ["rows: { id: string; label: string; value: bigint | null; cost?: bigint | null; middle?: string }[]", "rows: CompactRow[]"],
            ["groups(group.events, 'month').flatMap(row =>", "groups(group.events, 'month').flatMap<CompactRow>(row =>"],
          ]);
          check('frontend/tests/targets/profit-v04.spec.ts', [["const nav = document.querySelector('.MuiBottomNavigation-root')!;", "const nav = [...document.querySelectorAll('.MuiBottomNavigation-root')].find(node => getComputedStyle(node).display !== 'none')!;"]]);
          NODE
          then
            echo 'grep=exact realized-cost|requested geometry|long amounts' >> "$GITHUB_OUTPUT"
            echo 'Preserved 16 passing state/account/navigation cases from run 37248410867. Repeat calculation once and eight layout/long-amount cases for changed inputs.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'grep=.*' >> "$GITHUB_OUTPUT"
          fi
      - name: Changed profit functions at four requested sizes
        if: steps.passed.outputs.cache-hit != 'true'
        run: npx playwright test --config=playwright.targets.config.ts profit-v04.spec.ts --grep '${{ steps.scope.outputs.grep }}' --workers=2
        working-directory: frontend
      - if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p "${{ runner.temp }}/profit-v04-passed" && git rev-parse HEAD > "${{ runner.temp }}/profit-v04-passed/passed"
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/profit-v04-passed
          key: profit-v04-v1-${{ hashFiles('frontend/src/**', 'frontend/tests/targets/profit-v04.spec.ts', 'frontend/playwright.targets.config.ts', 'frontend/package.json', 'package-lock.json', '.github/workflows/profit-function-check.yml') }}
      - name: Record execution
        if: always()
        run: echo "SHA $(git rev-parse HEAD); run $GITHUB_RUN_ID; reused ${{ steps.passed.outputs.cache-hit }}; status ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.passed.outputs.cache-hit != 'true'
        with:
          name: profit-v04-functional-evidence
          path: |
            frontend/test-results/targets/
            frontend/playwright-targets-report/
          retention-days: 7
