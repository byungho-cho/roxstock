name: Improvements phase 3
on:
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/improvements-phase3-check.yml']
permissions:
  contents: read
jobs:
  phase3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:frontend
      - run: node --import tsx --test frontend/tests/unit/improvements-phase3.test.ts frontend/tests/unit/investment*.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.phase3.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: improvements-phase3-evidence
          path: frontend/test-results/phase3
          retention-days: 7
