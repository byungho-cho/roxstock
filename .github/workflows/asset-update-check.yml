name: Asset Update Check (requested screen only)

on:
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/asset-update-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    # One-off, explicitly requested four-size asset check. Not a required/general QA gate.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/assets-v03-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --workspace frontend --include-workspace-root=false
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Check changed asset screen only at the four requested sizes
        working-directory: frontend
        run: npx playwright test --config=playwright.targets.config.ts assets-v03.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: asset-update-failure
          path: frontend/test-results/targets/
          retention-days: 3
