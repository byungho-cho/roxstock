name: Empty Financial and Stock Frames
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/empty-frames-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --workspace frontend --include-workspace-root=false
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config playwright.empty-frames.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: empty-frames-failure
          path: frontend/test-results/empty-frames/
          retention-days: 7
