name: Phase18 Loading Performance
on:
  pull_request:
    branches: [main]
    paths: [frontend/**, backend/**, database/**, .github/workflows/phase18-check.yml]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config=playwright.targets.config.ts phase18-loading.spec.ts home-v03.spec.ts --workers=2
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase18-screen-evidence
          path: |
            frontend/test-results/targets/
            frontend/playwright-targets-report/
