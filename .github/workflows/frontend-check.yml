name: Frontend Check
on:
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - shared/src/domain/korean-holidays.ts
      - shared/src/domain/market-calendar.ts
      - shared/src/domain/dart-review.ts
      - '!frontend/tests/**'
      - '!frontend/**/*.md'
      - package.json
      - package-lock.json
      - .github/workflows/frontend-check.yml
      - .github/workflows/frontend-image.yml
  workflow_call:
    inputs:
      target_sha:
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: frontend-check-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      run_checks: ${{ steps.scope.outputs.run_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A production merge can reuse the successful PR check only when its application inputs are identical.
          if [ "$GITHUB_EVENT_NAME" = push ] && git rev-parse HEAD^2 >/dev/null 2>&1; then
            validated_head="$(git rev-parse HEAD^2)"
            if git diff --quiet "$validated_head" HEAD -- frontend/src frontend/scripts frontend/public frontend/tsconfig*.json frontend/vite.config.ts frontend/index.html frontend/package.json frontend/Dockerfile frontend/nginx.conf shared/src/domain/korean-holidays.ts shared/src/domain/market-calendar.ts shared/src/domain/dart-review.ts package.json package-lock.json; then
              passed_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$validated_head&event=pull_request&per_page=30" --jq '[.workflow_runs[] | select(.path == ".github/workflows/frontend-check.yml" and .conclusion == "success")] | first | .id // empty')"
              if [ -n "$passed_run" ]; then
                echo "run_checks=false" >> "$GITHUB_OUTPUT"
                echo "Production application inputs match PR head $validated_head. Reuse successful Frontend Check run $passed_run; do not repeat TypeScript/build." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
          if [ -n '${{ inputs.target_sha }}' ] || [ -z "$BASE_SHA" ] || node --input-type=module -e 'import {compareScope} from "./scripts/deployment-scope.mjs"; process.exit(compareScope(process.env.BASE_SHA,process.env.GITHUB_SHA).frontend?0:1)'; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
            echo "Application inputs unchanged. Preserve earlier successful TypeScript/build results." >> "$GITHUB_STEP_SUMMARY"
          fi
  typecheck:
    name: Frontend TypeScript
    needs: scope
    if: needs.scope.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache/restore@v4
        id: passed
        with:
          path: ${{ runner.temp }}/roxstock-typecheck
          key: frontend-typecheck-node20-v1-${{ hashFiles('frontend/src/**', 'frontend/scripts/**', 'frontend/public/**', 'frontend/tsconfig*.json', 'frontend/vite.config.ts', 'frontend/index.html', 'frontend/package.json', 'package.json', 'package-lock.json') }}
      - if: steps.passed.outputs.cache-hit != 'true'
        run: npm ci --workspace frontend --include-workspace-root=false
      - if: steps.passed.outputs.cache-hit != 'true'
        run: npm run typecheck:frontend
      - if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p "${{ runner.temp }}/roxstock-typecheck" && git rev-parse HEAD > "${{ runner.temp }}/roxstock-typecheck/passed"
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/roxstock-typecheck
          key: frontend-typecheck-node20-v1-${{ hashFiles('frontend/src/**', 'frontend/scripts/**', 'frontend/public/**', 'frontend/tsconfig*.json', 'frontend/vite.config.ts', 'frontend/index.html', 'frontend/package.json', 'package.json', 'package-lock.json') }}
      - name: Record result
        run: |
          echo "### Frontend TypeScript" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD); reused: ${{ steps.passed.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
  build:
    name: Frontend Build
    needs: scope
    if: needs.scope.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache/restore@v4
        id: passed
        with:
          path: ${{ runner.temp }}/roxstock-build
          key: frontend-build-node20-v1-${{ hashFiles('frontend/src/**', 'frontend/scripts/**', 'frontend/public/**', 'frontend/tsconfig*.json', 'frontend/vite.config.ts', 'frontend/index.html', 'frontend/package.json', 'package.json', 'package-lock.json') }}
      - if: steps.passed.outputs.cache-hit != 'true'
        run: npm ci --workspace frontend --include-workspace-root=false
      - if: steps.passed.outputs.cache-hit != 'true'
        run: npm run build:frontend
      - if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p "${{ runner.temp }}/roxstock-build" && git rev-parse HEAD > "${{ runner.temp }}/roxstock-build/passed"
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/roxstock-build
          key: frontend-build-node20-v1-${{ hashFiles('frontend/src/**', 'frontend/scripts/**', 'frontend/public/**', 'frontend/tsconfig*.json', 'frontend/vite.config.ts', 'frontend/index.html', 'frontend/package.json', 'package.json', 'package-lock.json') }}
      - name: Record result
        run: |
          echo "### Frontend Build" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $(git rev-parse HEAD); reused: ${{ steps.passed.outputs.cache-hit }}" >> "$GITHUB_STEP_SUMMARY"
  native_currency_ui:
    name: Native currency UI
    needs: scope
    if: needs.scope.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    # Includes news, notifications and bottom-navigation suites; retain all checks.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --workspace frontend --include-workspace-root=false
      - run: npx --workspace frontend playwright install --with-deps chromium
      - run: cd frontend && npx playwright test -c playwright.native-currency.config.ts
      - name: Phase32 home cards (cover 370x465 and tablet 725x396)
        run: cd frontend && npx playwright test -c playwright.phase32.config.ts
      - name: Phase33 stock news (Figma cover and tablet)
        run: cd frontend && npx playwright test -c playwright.phase33.config.ts
      - name: Phase34 toast and stock news layout
        run: cd frontend && npx playwright test -c playwright.phase34-stock-news.config.ts
      - name: Phase35 news schedule and dashboard v1.2
        run: |
          node --import tsx --test frontend/src/utils/assetComposition.test.ts
          cd frontend && npx playwright test -c playwright.phase35.config.ts
      - name: DART statuses, progress and task detail (cover and tablet)
        run: cd frontend && npx playwright test -c playwright.dart-task-status.config.ts
      - name: App notifications and administrator separation (cover and tablet)
        run: cd frontend && npx playwright test -c playwright.app-notifications.config.ts
      - name: Common bottom navigation viewport regression
        run: cd frontend && npx playwright test -c playwright.bottom-nav-viewport.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-currency-ui-${{ github.run_id }}
          path: |
            frontend/test-results/native-currency
            frontend/test-results/home-phase32
            frontend/test-results/stock-news-phase33
            frontend/test-results/stock-news-phase34
            frontend/test-results/news-schedule-dashboard
            frontend/test-results/bottom-nav-viewport
            frontend/test-results/app-notifications-admin
            frontend/test-results/dart-task-status
