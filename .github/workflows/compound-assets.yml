name: Download compound form Figma assets
on:
  push:
    branches: [codex/compound-value-v04-20261005]
    paths: [.github/workflows/compound-assets.yml]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact provided form icons
        run: |
          node --input-type=module <<'JS'
          const base='https://www.figma.com/api/mcp/asset/3d679597-f543-45f5-89c0-ce1b6c83f152';
          for(const [file,url]of [['clear.svg',base+'/adbbf.svg'],['year-picker.svg',base+'/88a06.svg']]){
            const response=await fetch(url);if(!response.ok)throw new Error(response.status+' '+file);
            const svg=await response.text();if(!svg.includes('<svg'))throw new Error('Not SVG');
            console.log('FIGMA_ASSET '+JSON.stringify({file,svg}));
          }
          JS
