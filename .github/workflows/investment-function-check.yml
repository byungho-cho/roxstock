name: Investment v0.4 Function Check
on:
  pull_request:
    branches: [main]
    paths:
      - frontend/src/pages/investment/**
      - frontend/public/investment-*.svg
      - frontend/tests/targets/investment-v04.spec.ts
      - .github/workflows/investment-function-check.yml
permissions:
  contents: read
concurrency:
  group: investment-v04-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache/restore@v4
        id: passed
        with:
          path: ${{ runner.temp }}/investment-v04-passed
          key: investment-v04-v1-${{ hashFiles('frontend/src/**', 'frontend/public/investment-*.svg', 'frontend/tests/targets/investment-v04.spec.ts', 'frontend/playwright.targets.config.ts', 'frontend/package.json', 'package-lock.json', '.github/workflows/investment-function-check.yml') }}
      - if: steps.passed.outputs.cache-hit != 'true'
        run: npm ci --workspace frontend --include-workspace-root=false
      - if: steps.passed.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Select changed test scope while preserving verified results
        id: scope
        shell: bash
        run: |
          # Run 37243070077 verified the 24 core cases on this exact application input.
          # Its only failures were the newly combined journey's total 30s budget.
          # Reuse is limited to an otherwise-identical test with that timeout metadata changed.
          verified=91c326cfa2b31ec77ce4790bb2bc575ce07667a6
          changed_test_lines="$(git diff --unified=0 "$verified" HEAD -- frontend/tests/targets/investment-v04.spec.ts | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)"
          if git diff --quiet "$verified" HEAD -- frontend/src frontend/public frontend/playwright.targets.config.ts frontend/package.json package.json package-lock.json && [ "$changed_test_lines" = '+  test.setTimeout(60_000);' ]; then
            echo 'grep=large amounts, zero denominator, edited historical principal and changing pagination' >> "$GITHUB_OUTPUT"
            echo 'Preserved 24 passing core cases from run 37243070077. Only repeat the four related complex-journey cases; assertion timeouts remain unchanged.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'grep=.*' >> "$GITHUB_OUTPUT"
          fi
      - name: Changed investment functions at four requested sizes
        if: steps.passed.outputs.cache-hit != 'true'
        run: npx playwright test --config=playwright.targets.config.ts investment-v04.spec.ts --grep '${{ steps.scope.outputs.grep }}' --workers=2
        working-directory: frontend
      - if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p "${{ runner.temp }}/investment-v04-passed" && git rev-parse HEAD > "${{ runner.temp }}/investment-v04-passed/passed"
      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/investment-v04-passed
          key: investment-v04-v1-${{ hashFiles('frontend/src/**', 'frontend/public/investment-*.svg', 'frontend/tests/targets/investment-v04.spec.ts', 'frontend/playwright.targets.config.ts', 'frontend/package.json', 'package-lock.json', '.github/workflows/investment-function-check.yml') }}
      - name: Record execution
        if: always()
        run: |
          echo "SHA: $(git rev-parse HEAD); Run: $GITHUB_RUN_ID; reused: ${{ steps.passed.outputs.cache-hit }}; status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.passed.outputs.cache-hit != 'true'
        with:
          name: investment-v04-evidence
          path: |
            frontend/test-results/targets/
            frontend/playwright-targets-report/
          retention-days: 7
