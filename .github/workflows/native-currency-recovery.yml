name: Native Currency Recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-currency-recovery.yml']
  workflow_dispatch:
    inputs:
      application_sha:
        description: 'Already deployed immutable application SHA'
        required: true
        default: '90b612f057ae22c66a54935ae7072d3e32523bc4'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: native-currency-production-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APPLICATION_SHA: ${{ inputs.application_sha || '90b612f057ae22c66a54935ae7072d3e32523bc4' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APPLICATION_SHA }}
      - name: Verify pinned application and run bounded recovery
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$APPLICATION_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$(git rev-parse HEAD)" == "$APPLICATION_SHA" ]] || exit 2
          [[ "$(node -p 'require("./backend/src/release.json").version')" == 1.1.16 ]] || exit 2
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $APPLICATION_SHA" < scripts/recover-foreign-production.sh | tee "$RUNNER_TEMP/native-currency-recovery-summary.txt"
          grep -q '"policy":"native-currency-v1"' "$RUNNER_TEMP/native-currency-recovery-summary.txt"
          cat "$RUNNER_TEMP/native-currency-recovery-summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Read source-storage and calculation outcomes without exporting DB data
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$DEPLOY_USER@$DEPLOY_HOST" \
            'docker exec -i roxstock-dart-collector node --input-type=module' <<'NODE' | tee "$RUNNER_TEMP/native-currency-recovery-outcomes.txt"
          import {PrismaClient,Prisma} from './shared/dist/generated/prisma/index.js';
          const db=new PrismaClient();
          try{
            const runs=await db.collectorRun.findMany({where:{jobType:'foreign-currency-recovery'},orderBy:{id:'desc'},take:20,select:{id:true,status:true,startedAt:true,finishedAt:true,successCount:true,failureCount:true,skippedCount:true,metadata:true}});
            const ids=runs.map(r=>r.id);
            const reasons=ids.length?await db.$queryRaw(Prisma.sql`SELECT status,COALESCE(JSON_UNQUOTE(JSON_EXTRACT(diagnostics,'$.validationResult')),message,'UNKNOWN') AS reason,COUNT(*) AS count FROM collector_run_items WHERE run_id IN (${Prisma.join(ids)}) GROUP BY status,reason`):[];
            const currencies=ids.length?await db.$queryRaw(Prisma.sql`SELECT JSON_UNQUOTE(JSON_EXTRACT(diagnostics,'$.currency')) AS currency,COUNT(*) AS count FROM collector_run_items WHERE run_id IN (${Prisma.join(ids)}) AND status='SUCCESS' GROUP BY currency`):[];
            const unresolved=[];let cursor=0n,hasMoreUnresolved=false;
            const where={status:'FAILED',errorCode:'REVIEW_REQUIRED',diagnostics:{path:'$.validationResult',equals:'NON_KRW_STORAGE_UNSUPPORTED'}};
            for(let page=0;page<20;page++){
              const tasks=await db.dartBackfillTask.findMany({where:{...where,id:{gt:cursor}},orderBy:{id:'asc'},take:25,include:{security:{select:{symbol:true,name:true,isActive:true,collectionExcluded:true}}}});
              for(const t of tasks){
                const last=await db.collectorRunItem.findFirst({where:{securityId:t.securityId,symbol:{endsWith:`:${t.fiscalYear}:${t.periodType}`},run:{jobType:'foreign-currency-recovery'},status:{in:['FAILED','SKIPPED']}},orderBy:{id:'desc'},select:{message:true,diagnostics:true,createdAt:true}});
                unresolved.push({taskId:String(t.id),securityId:String(t.securityId),symbol:t.security.symbol,name:t.security.name,fiscalYear:t.fiscalYear,periodType:t.periodType,active:t.security.isActive,excluded:t.security.collectionExcluded,reason:last?.diagnostics?.validationResult??last?.message??'NOT_ATTEMPTED',observedAt:last?.createdAt??null,originalReason:t.diagnostics?.validationResult});
              }
              if(tasks.length<25)break;cursor=tasks.at(-1).id;if(page===19)hasMoreUnresolved=true;
            }
            const unresolvedSummary=Object.entries(unresolved.reduce((a,t)=>(a[t.reason]=(a[t.reason]??0)+1,a),{})).map(([reason,count])=>({reason,count}));
            const sourceSamples=await db.dartFinancialFiling.findMany({where:{collectedAt:{gte:new Date('2026-10-18T23:40:00Z')},NOT:{sourceValidation:{path:'$.currency',equals:'KRW'}}},orderBy:{collectedAt:'desc'},take:8,select:{securityId:true,fiscalYear:true,periodType:true,receiptNo:true,fsDivision:true,periodEndDate:true,collectedAt:true,revenueYtd:true,totalEquity:true,sourceValidation:true}});
            console.log(JSON.stringify({unresolvedSummary,unresolved,hasMoreUnresolved,sourceSamples},(_,v)=>typeof v==='bigint'?String(v):v));
            console.log(JSON.stringify({runs,reasons,currencies},(_,v)=>typeof v==='bigint'?v.toString():v));
          }finally{await db.$disconnect();}
          NODE
          cat "$RUNNER_TEMP/native-currency-recovery-outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-currency-recovery-outcome-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-currency-recovery-summary.txt
            ${{ runner.temp }}/native-currency-recovery-outcomes.txt
