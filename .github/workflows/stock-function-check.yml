name: Stock Function Check
on:
  pull_request:
    branches: [main]
    paths: [frontend/**, .github/workflows/stock-function-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Fetch confirmed Figma icons for visual comparison
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib
          for name, asset in zip(["stocks","journal","home","assets","more"],json.loads(pathlib.Path("frontend/design-v04-assets.json").read_text())):
            data=urllib.request.urlopen(asset["url"],timeout=30).read()
            assert len(data)==asset["sizeBytes"] and b"<svg" in data
            pathlib.Path("frontend/public/home-v04/"+name+".svg").write_bytes(data)
          PY
      - run: npm ci
      - run: node --import tsx --test frontend/tests/unit/stockMath.test.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config=playwright.targets.config.ts account-classification.spec.ts home-v04.spec.ts
        working-directory: frontend
      - name: Connected Lot sell and trade edit save/failure flows
        run: npx playwright test --config=playwright.targets.config.ts stocks-v03.spec.ts --project=cover-370x465 --project=tablet-725x396 --grep "Lot price evaluation|buy edit replaces" --output=test-results/stock-trade
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-v04-functional-visual-evidence
          path: |
            frontend/test-results/
            frontend/public/home-v04/
          retention-days: 3
