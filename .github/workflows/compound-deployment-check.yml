name: Compound Plans and Value Cards Deployment Check
on:
  # Deployment hold: explicit user request, 2026-10-06. No automatic main pushes.
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  deploy-and-production-read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm deploy and changed production HTTP functions (read only)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/compound-deployment-smoke.mjs
