name: Phase 17 UI follow-up
on:
  pull_request:
    branches: [main]
    paths: [frontend/**, .github/workflows/phase17-followup-check.yml]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test frontend/tests/unit/compound-achievement.test.ts frontend/tests/unit/account-updated-at.test.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test -c playwright.phase17.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase17-followup-qa
          path: frontend/test-results
          retention-days: 14
