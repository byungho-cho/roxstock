name: PR Auto Merge
on:
  workflow_run:
    workflows: [PR Validation]
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: pr-auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never checkout or execute PR code in this privileged workflow.
      - name: Enable eligible PR auto-merge and dispatch production
        uses: actions/github-script@v7
        with:
          script: |
            let numbers = context.payload.pull_request ? [context.payload.pull_request.number] : context.payload.workflow_run.pull_requests.map(p => p.number);
            if (!numbers.length && context.payload.workflow_run) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({...context.repo, commit_sha: context.payload.workflow_run.head_sha});
              numbers = associated.data.map(p => p.number);
            }
            for (const number of numbers) {
              let {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
              if (pr.draft || pr.base.ref !== 'main' || pr.head.repo?.full_name !== process.env.GITHUB_REPOSITORY) continue;
              if (context.payload.workflow_run && pr.head.sha !== context.payload.workflow_run.head_sha) continue;
              if (pr.state === 'open') {
                // Queue PR-level auto-merge. Branch protection enforces PR Gate and an up-to-date branch.
                // Registration on opened/synchronize is safe: no PR code or artifacts are used.
                if (pr.mergeable_state === 'clean') {
                  // GitHub rejects enableAutoMerge once already clean. Merge normally;
                  // required checks, strict base protection, and expected head still apply.
                  try {
                    await github.rest.pulls.merge({...context.repo, pull_number: number, merge_method: 'merge', sha: pr.head.sha});
                  } catch (error) {
                    // GitHub auto-merge may win after the clean snapshot. Dispatch only
                    // after re-reading a confirmed merge; retain real merge failures.
                    ({data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number}));
                    if (!pr.merged) throw error;
                    core.notice('Concurrent auto-merge confirmed for PR #' + number);
                  }
                  ({data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number}));
                } else if (!pr.auto_merge) {
                  await github.graphql('mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:MERGE}){pullRequest{id}}}', {id: pr.node_id});
                }
                if (!context.payload.workflow_run && !pr.merged) continue;
                for (let attempt = 0; attempt < 24 && !pr.merged; attempt++) {
                  await new Promise(r => setTimeout(r, 5000));
                  ({data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number}));
                  if (pr.state === 'closed' && !pr.merged) break;
                }
              }
              if (pr.merged) {
                // GITHUB_TOKEN merges do not trigger push workflows. Dispatch explicitly.
                await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: 'production-deploy.yml', ref: 'main', inputs: {target_sha: pr.merge_commit_sha}});
                core.notice('Production dispatched for PR #' + number + ': ' + pr.merge_commit_sha);
              } else {
                core.notice('PR #' + number + ' remains pending (checks, conflict, or base update)');
              }
            }
