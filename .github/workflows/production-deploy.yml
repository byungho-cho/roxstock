name: Production Deploy
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Merged main commit (blank uses current main)'
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: roxstock-production
  cancel-in-progress: false
jobs:
  revision:
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.revision.outputs.current }}
      backend: ${{ steps.scope.outputs.backend }}
      collector: ${{ steps.scope.outputs.collector }}
      frontend: ${{ steps.scope.outputs.frontend }}
      android: ${{ steps.native.outputs.android }}
    steps:
      - uses: actions/github-script@v7
        id: revision
        env:
          REQUESTED_SHA: ${{ inputs.target_sha || github.sha }}
        with:
          script: |
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const sha = process.env.REQUESTED_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('Full immutable SHA required');
            core.setOutput('current', String(branch.commit.sha === sha));
            if (branch.commit.sha !== sha) core.notice('Superseded revision; deployment skipped');
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0
      - name: Read deployed component image identities
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker inspect --format '{{.Name}}|{{.Config.Image}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' roxstock-backend roxstock-collector roxstock-realtime-collector roxstock-dart-collector roxstock-frontend" > "$RUNNER_TEMP/roxstock-deployed-images.txt"
          cat "$RUNNER_TEMP/roxstock-deployed-images.txt" >> "$GITHUB_STEP_SUMMARY"
      - id: native
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          apk_version="$(node -e 'const s=require("fs").readFileSync("android-app/app/build.gradle","utf8"); const m=s.match(/\bversionName\s+[\x27]([^\x27]+)[\x27]/); if(!m)throw Error("Android version missing"); process.stdout.write(m[1]);')"
          # Recover a previously built but unpublished APK after a partial deployment.
          if git diff --quiet "$TARGET_SHA^1" "$TARGET_SHA" -- android-app &&
             curl --fail --silent --show-error --max-time 15 --retry 1 https://newrox.cafe24.com/downloads/android/notifications-latest.json -o "$RUNNER_TEMP/published-android.json" &&
             node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.exit(p.version===process.argv[2] && p.firebaseConfigured===true?0:1)' "$RUNNER_TEMP/published-android.json" "$apk_version"; then
            echo "android=false" >> "$GITHUB_OUTPUT"
          else
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi
      - id: scope
        if: steps.revision.outputs.current == 'true'
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {selectDeployedServices} from "./scripts/deployment-scope.mjs"; const lines=readFileSync(process.env.RUNNER_TEMP+"/roxstock-deployed-images.txt","utf8"); for(const [k,v] of Object.entries(selectDeployedServices(lines,process.env.TARGET_SHA))) console.log(k+"="+v)' >> "$GITHUB_OUTPUT"
  backend:
    needs: revision
    if: needs.revision.outputs.current == 'true' && needs.revision.outputs.backend == 'true'
    uses: ./.github/workflows/backend-deploy.yml
    with:
      target_sha: ${{ inputs.target_sha || github.sha }}
    secrets: inherit
  collector:
    needs: [revision, backend]
    if: always() && needs.revision.outputs.current == 'true' && needs.revision.outputs.collector == 'true' && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    uses: ./.github/workflows/collector-deploy.yml
    with:
      target_sha: ${{ inputs.target_sha || github.sha }}
    secrets: inherit
  frontend:
    needs: [revision, backend, collector]
    if: always() && needs.revision.outputs.current == 'true' && needs.revision.outputs.frontend == 'true' && (needs.backend.result == 'success' || needs.backend.result == 'skipped') && (needs.collector.result == 'success' || needs.collector.result == 'skipped')
    uses: ./.github/workflows/frontend-image.yml
    with:
      target_sha: ${{ inputs.target_sha || github.sha }}
    secrets: inherit

  foreign_recovery:
    needs: [revision, backend, collector, frontend]
    if: always() && needs.revision.outputs.current == 'true' && needs.backend.result == 'success' && needs.collector.result == 'success' && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Recover exact foreign storage holds after verified deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          # This one-time migration belongs to 1.1.16. Later releases use the normal bounded collector.
          test "$(node -p 'require("./backend/src/release.json").version')" = 1.1.16 || exit 0
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/deploy_key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $TARGET_SHA" < scripts/recover-foreign-production.sh | tee "$RUNNER_TEMP/foreign-recovery-summary.txt"
          cat "$RUNNER_TEMP/foreign-recovery-summary.txt" >> "$GITHUB_STEP_SUMMARY"

  news_activation:
    needs: [revision, backend, collector, frontend]
    if: always() && needs.revision.outputs.current == 'true' && needs.backend.result == 'success' && needs.collector.result == 'success' && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Verify feature deployment and first real news collection
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          case "$(node -p 'require("./backend/src/release.json").version')" in 1.1.18|1.1.19|1.1.20|1.1.25) ;; *) exit 0 ;; esac
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          script=scripts/verify-stock-news-production.sh
          marker=STOCK_NEWS_FIRST_COLLECTION_AND_STORED_API_VERIFIED
          if test "$(node -p 'require("./backend/src/release.json").version')" = 1.1.25; then
            script=scripts/verify-news-schedule-production.sh
            marker=NEWS35_DEPLOYED_SUPPLEMENT_AND_STORED_LIST_VERIFIED
          fi
          scp -i "$HOME/.ssh/deploy_key" -P "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes "$script" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/roxstock-news-$TARGET_SHA.sh"
          ssh -i "$HOME/.ssh/deploy_key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "bash /tmp/roxstock-news-$TARGET_SHA.sh $TARGET_SHA" | tee "$RUNNER_TEMP/stock-news-first-result.txt"
          grep -q "$marker" "$RUNNER_TEMP/stock-news-first-result.txt"
          cat "$RUNNER_TEMP/stock-news-first-result.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-news-first-production-result
          path: ${{ runner.temp }}/stock-news-first-result.txt

  android:
    needs: revision
    if: needs.revision.outputs.current == 'true' && needs.revision.outputs.android == 'true'
    uses: ./.github/workflows/android-app-check.yml
    with:
      target_sha: ${{ inputs.target_sha || github.sha }}
    secrets: inherit

  android_publish:
    needs: [revision, android, frontend]
    if: always() && needs.revision.outputs.current == 'true' && needs.android.result == 'success' && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: roxstock-notifications-apk
          path: notifications-apk
          run-id: ${{ github.run_id }}
      - name: Publish verified signed notifications APK
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          apk_file="$(find notifications-apk -name 'app-notifications-release.apk' -type f -print -quit)"
          test -n "$apk_file"
          digest="$(sha256sum "$apk_file" | cut -d ' ' -f 1)"
          configured="$(python3 - "$apk_file" "$digest" <<'PY'
          import json,pathlib,sys
          r=json.loads(pathlib.Path(sys.argv[1]).with_suffix('.verification.json').read_text())
          assert r['sha256']==sys.argv[2] and r['signatureVerified'] and r['applicationId']=='com.roxstock.app.debug' and r['versionName']=='0.1.8' and r['versionCode']==9
          print('true' if r['firebaseConfigured'] else 'false')
          PY
          )"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          scp -i "$HOME/.ssh/deploy_key" -P "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes "$apk_file" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/roxstock-notifications-$TARGET_SHA.apk"
          scp -i "$HOME/.ssh/deploy_key" -P "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes android-app/publish-notifications-apk.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/roxstock-notifications-$TARGET_SHA.sh"
          ssh -i "$HOME/.ssh/deploy_key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash /tmp/roxstock-notifications-$TARGET_SHA.sh $TARGET_SHA $digest $configured"

  dart_status_correction:
    needs: [revision, backend, collector, frontend]
    if: always() && needs.revision.outputs.current == 'true' && needs.backend.result == 'success' && needs.collector.result == 'success' && needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Back up audited tasks and reconcile without duplicate financial recollection
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test "$(node -p 'require("./backend/src/release.json").version')" = 1.2.2 || exit 0
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 2
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          scp -i "$HOME/.ssh/deploy_key" -P "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes scripts/reconcile-dart-status-production.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/roxstock-dart-status-$TARGET_SHA.sh"
          ssh -i "$HOME/.ssh/deploy_key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash /tmp/roxstock-dart-status-$TARGET_SHA.sh $TARGET_SHA" | tee "$RUNNER_TEMP/dart-status-summary.txt"
          cat "$RUNNER_TEMP/dart-status-summary.txt" >> "$GITHUB_STEP_SUMMARY"


  app_notification_verification:
    needs: [revision, backend, frontend, android_publish]
    if: always() && needs.revision.outputs.current == 'true' && needs.backend.result == 'success' && needs.frontend.result == 'success' && needs.android_publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Verify notification defaults and safe admin projections without dispatching push
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test "$(node -p 'require("./backend/src/release.json").version')" = 1.2.3 || exit 0
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          scp -i "$HOME/.ssh/deploy_key" -P "${DEPLOY_PORT:-22}" -o StrictHostKeyChecking=yes scripts/verify-app-notifications-production.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/roxstock-notification-verify-$TARGET_SHA.sh"
          ssh -i "$HOME/.ssh/deploy_key" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "bash /tmp/roxstock-notification-verify-$TARGET_SHA.sh $TARGET_SHA"
