name: DART Receipt Verify Once
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/dart-receipt-run-once.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch-reviewed-main:
    if: github.head_ref == 'ops/dart-receipt-verify-once-20261012' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # No checkout, SSH, secret access or PR code on the server. Dispatch only reviewed main.
      - uses: actions/github-script@v7
        with:
          script: |
            const expected = '031c0bd4de15687ed54984802d6f40747001f7e2';
            const {data: branch} = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (branch.commit.sha !== expected) throw new Error('Reviewed main changed; verification not dispatched');
            const {data: deploy} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 38185706452});
            if (deploy.head_sha !== expected || deploy.conclusion !== 'success') throw new Error('Matching production deployment required');
            await github.rest.actions.createWorkflowDispatch({...context.repo, workflow_id: 'dart-receipt-verification.yml', ref: 'main', inputs: {mode: 'representative'}});
            core.notice('Dispatched reviewed DART_SOURCE_V2 once; existing runtime enforces max12, usage budget, lock and version marker');
