name: Account management phase 15
on:
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/phase15-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test frontend/src/utils/cashAllocation.test.ts
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test -c playwright.phase15.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase15-screenshots
          path: frontend/test-results/phase15/
          retention-days: 14
