name: Phase20 Input and Loading
on:
  pull_request:
    branches: [main]
    paths: [frontend/**, .github/workflows/phase20-check.yml]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node --import tsx --test frontend/tests/unit/phase20.test.ts
      - run: npx playwright test --config playwright.phase20.config.ts
        working-directory: frontend
        env:
          ROX_PHASE20_CAPTURE_DIR: test-results/phase20/captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase20-screen-evidence
          path: frontend/test-results/phase20/
