name: Frontend Image Packaging Check
on:
  pull_request:
    branches: [main]
    paths:
      - frontend/Dockerfile
      - frontend/src/**
      - shared/src/domain/**
      - .github/workflows/frontend-image-packaging.yml
permissions:
  contents: read
concurrency:
  group: frontend-image-packaging-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the actual production frontend image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          build-args: VITE_DATA_SOURCE=api
          cache-from: type=gha,scope=frontend-packaging
          cache-to: type=gha,mode=max,scope=frontend-packaging
