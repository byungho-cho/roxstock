name: Frontend Image Packaging Check
on:
  pull_request:
    branches: [main]
    paths:
      - frontend/Dockerfile
      - frontend/nginx.conf
      - frontend/src/**
      - shared/src/domain/**
      - .github/workflows/frontend-image-packaging.yml
permissions:
  contents: read
concurrency:
  group: frontend-image-packaging-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the actual production frontend image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: roxstock-frontend-packaging:test
          build-args: VITE_DATA_SOURCE=api
          cache-from: type=gha,scope=frontend-packaging
          cache-to: type=gha,mode=max,scope=frontend-packaging
      - name: Verify real HTTP SPA paths and static icons
        run: |
          docker run --detach --name frontend-packaging-smoke --publish 127.0.0.1:38080:80 roxstock-frontend-packaging:test
          trap 'docker rm --force frontend-packaging-smoke >/dev/null' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 http://127.0.0.1:38080/health
          for route in / /assets /assets/ /live-quotes /live-quotes/ /live-quotes/add; do
            curl --fail --silent --show-error "http://127.0.0.1:38080$route" | grep -q 'id="root"'
          done
          curl --fail --silent --show-error http://127.0.0.1:38080/live-quotes/menu.svg | grep -q '<svg'
