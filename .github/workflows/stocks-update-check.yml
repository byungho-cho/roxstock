name: Stocks Update Check (requested screen only)
on:
  pull_request:
    branches: [main]
    paths: [frontend/**, .github/workflows/stocks-update-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stocks:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/stocks-v03-20261002' || github.head_ref == 'codex/stocks-v04-refactor-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --workspace frontend --include-workspace-root=false
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config=playwright.targets.config.ts stocks-v04.spec.ts user-test-fixes-v04.spec.ts --grep-invert "journal period|cash period" --workers=2
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stocks-scoped-check
          path: frontend/test-results/targets/
          retention-days: 3
