name: Backend Test Build Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - database/prisma/**
      - infra/docker/compose.prod-backend.yml
      - scripts/deploy-backend.sh
      - package.json
      - package-lock.json
      - .dockerignore
      - .github/workflows/backend-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roxstock-backend-production
  cancel-in-progress: false

jobs:
  test:
    name: Backend Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --workspace backend run prisma:validate
      - run: npm --workspace backend run prisma:generate
      - run: npm --workspace backend run typecheck
      - run: npm --workspace backend test

  build:
    name: Backend Build
    needs: test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --workspace backend run prisma:generate
      - run: npm --workspace backend run build

  docker:
    name: Backend Docker Build
    needs: build
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag
        id: image
        shell: bash
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/roxstock-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - name: Smoke test production image
        shell: bash
        run: |
          docker build -f backend/Dockerfile -t roxstock-backend-smoke .
          docker run -d --rm --name roxstock-backend-smoke -e DATABASE_URL='mysql://smoke:smoke@127.0.0.1:3306/smoke' roxstock-backend-smoke
          for i in {1..20}; do
            if docker exec roxstock-backend-smoke node -e "fetch('http://127.0.0.1:3300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 1
          done
          docker logs roxstock-backend-smoke
          exit 1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Backend Deploy
    needs: docker
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
      - name: Deploy immutable backend image
        shell: bash
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$IMAGE_TAG'" <<'REMOTE'
            set -Eeuo pipefail
            IMAGE_TAG="$1"
            SOURCE_TREE=/opt/roxstock
            DEPLOY_TREE=/opt/roxstock/.deploy/worktree
            git -C "$SOURCE_TREE" fetch origin main
            if git -C "$DEPLOY_TREE" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git -C "$DEPLOY_TREE" checkout --detach origin/main
            else
              mkdir -p "$(dirname "$DEPLOY_TREE")"
              git -C "$SOURCE_TREE" worktree add --detach "$DEPLOY_TREE" origin/main
            fi
            install -m 600 "$SOURCE_TREE/backend/.env.production" "$DEPLOY_TREE/backend/.env.production"
            bash "$DEPLOY_TREE/scripts/deploy-backend.sh" "$IMAGE_TAG"
          REMOTE
      - name: Verify external API
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors https://newrox.cafe24.com/api/accounts >/dev/null
          curl --fail --silent --show-error --retry 3 --retry-delay 2 https://newrox.cafe24.com/api/securities >/dev/null
      - name: Verify collector container
        shell: bash
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh -i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "test \"\$(docker inspect --format='{{.State.Health.Status}}' roxstock-collector)\" = healthy && test \"\$(docker inspect --format='{{.State.Health.Status}}' roxstock-realtime-collector)\" = healthy && test \"\$(docker inspect --format='{{.State.Health.Status}}' roxstock-dart-collector)\" = healthy"

