name: Cancel superseded PR checks
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout or execution of repository code with the actions-write token.
      - uses: actions/github-script@v7
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo,pull_number:context.payload.pull_request.number});
            if (pr.state !== 'open' || pr.head.repo?.full_name !== process.env.GITHUB_REPOSITORY || pr.head.sha !== context.payload.pull_request.head.sha) return;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{...context.repo,event:'pull_request',branch:pr.head.ref,per_page:100});
            let cancelled = 0;
            for (const run of runs) {
              if (run.id === context.runId || run.head_sha === pr.head.sha || run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY || run.status === 'completed') continue;
              // Recheck the current head before each cancellation; a queued old controller is harmless.
              const {data: current} = await github.rest.pulls.get({...context.repo,pull_number:pr.number});
              if (current.head.sha !== pr.head.sha || current.state !== 'open') return;
              try {await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id});cancelled++;}
              catch (error) {if (![404,409].includes(error.status)) throw error;}
            }
            core.info('Superseded same-branch PR checks cancelled: '+cancelled);
