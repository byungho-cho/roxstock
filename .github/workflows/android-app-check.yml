name: Android App Build
on:
  pull_request:
    paths: ['android-app/**', '.github/workflows/android-app-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build separate APKs and verify web-only package
        run: |
          gradle --no-daemon -p android-app assembleWebOnlyDebug lintWebOnlyDebug assembleNotificationsDebug assembleWebOnlyDebugAndroidTest
          python3 android-app/scripts/verify-web-only-apk.py android-app/app/build/outputs/apk/webOnly/debug/app-webOnly-debug.apk
      - name: Enable KVM for installation test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test web-only APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon -p android-app connectedWebOnlyDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: roxstock-web-only-test-apk
          path: |
            android-app/app/build/outputs/apk/webOnly/debug/*.apk
            android-app/app/build/outputs/apk/webOnly/debug/*.verification.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-only-installation-test-report
          path: android-app/app/build/reports/androidTests/connected/**
