name: Value task scoped CI cleanup
on:
  push:
    branches: [codex/value-analysis-v04-20261005]
    paths: [.github/workflows/value-design-assets.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel-unrequested-regression:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 37265119005 37265119010 37265119001; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" || true
          done
