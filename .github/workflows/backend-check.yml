name: Backend Check

on:
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-check.yml"

  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql://roxstock:roxstock@127.0.0.1:3306/roxstock

    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: roxstock
          MARIADB_USER: roxstock
          MARIADB_PASSWORD: roxstock
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Seed legacy data before classification migration
        shell: bash
        run: |
          mv database/prisma/migrations/20261002220000_account_classifications "$RUNNER_TEMP/account_classifications"
          npm run prisma:migrate:deploy
          node --import tsx backend/tests/classification-migration-seed.ts
          mv "$RUNNER_TEMP/account_classifications" database/prisma/migrations/20261002220000_account_classifications

      - name: Apply migrations to MariaDB
        run: npm run prisma:migrate:deploy

      - name: Account classification and trade consistency (real MariaDB API)
        run: node --import tsx --test backend/tests/account-classification.integration.ts

      - name: Changed compound-plan real database functions
        run: node --import tsx --test backend/tests/compound-growth.integration.ts

      - name: Asset analysis stored-data integration
        run: node --import tsx --test backend/tests/asset-analysis.integration.ts

      - name: Manual collector source and period API integration
        run: node --import tsx --test backend/tests/manual-collector.integration.ts

      - name: Cash12 latest balance and concurrent writes (real MariaDB API)
        run: node --import tsx --test backend/tests/cash-latest.integration.ts

      - name: DART recovery on isolated real MariaDB
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/roxstock_dart_recovery_test
        run: |
          node --import tsx backend/tests/prepare-dart-recovery.ts
          node --import tsx --test backend/tests/dart-recovery.integration.ts

      - name: Verify migration status
        run: npx prisma migrate status --schema database/prisma/schema.prisma

      - name: Account reset and deletion on isolated MariaDB
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/roxstock_phase15_test
        run: |
          node --import tsx backend/tests/prepare-accounts-phase15.ts
          node --import tsx --test backend/tests/accounts-phase15.integration.ts

      - name: Type-check backend
        run: npm run typecheck:backend

      - name: Test backend
        run: npm --workspace backend run test


      - name: Build backend
        run: npm run build:backend
