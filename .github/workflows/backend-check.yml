name: Backend Check

on:
  pull_request:
    paths:
      - "backend/**"
      - "database/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-check.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "database/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql://roxstock:roxstock@127.0.0.1:3306/roxstock

    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: roxstock
          MARIADB_USER: roxstock
          MARIADB_PASSWORD: roxstock
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply migrations to MariaDB
        run: npm run prisma:migrate:deploy

      - name: Verify migration status
        run: npx prisma migrate status --schema database/prisma/schema.prisma

      - name: Type-check backend
        run: npm run typecheck:backend
