name: Backend Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql://roxstock:roxstock@127.0.0.1:3306/roxstock

    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: roxstock
          MARIADB_USER: roxstock
          MARIADB_PASSWORD: roxstock
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Seed legacy data before classification migration
        shell: bash
        run: |
          mv database/prisma/migrations/20261002220000_account_classifications "$RUNNER_TEMP/account_classifications"
          npm run prisma:migrate:deploy
          node --import tsx backend/tests/classification-migration-seed.ts
          mv "$RUNNER_TEMP/account_classifications" database/prisma/migrations/20261002220000_account_classifications

      - name: Apply migrations to MariaDB
        run: npm run prisma:migrate:deploy

      - name: Phase23 legacy migration backup and restore (isolated real MariaDB)
        env:
          PHASE23_DB_CONTAINER: ${{ job.services.mariadb.id }}
        run: node --import tsx --test backend/tests/phase23-migration.integration.ts

      - name: Phase23 security management and collection fences (real MariaDB API)
        run: node --import tsx --test backend/tests/security-management.integration.ts

      - name: Authenticated manual and notification buys (real MariaDB)
        run: |
          node --test scripts/tests/buy-write-diagnostics.test.mjs
          node --import tsx --test backend/tests/authenticated-trades.integration.ts
          node --import tsx --test backend/tests/fee-estimate.integration.ts

      - name: App notifications and admin authorization (real MariaDB)
        run: node --import tsx --test backend/tests/app-notifications.integration.ts

      - name: DART authenticated priority task detail isolation
        run: node --import tsx --test backend/tests/dart-task-scope.integration.ts

      - name: Phase21 independent cursor pagination (real MariaDB API)
        run: node --import tsx --test backend/tests/monitoring-pages.integration.ts

      - name: Collection bug report persistence and review lifecycle (real MariaDB API)
        run: node --import tsx --test backend/tests/collection-bug-reports.integration.ts

      - name: Account classification and trade consistency (real MariaDB API)
        run: node --import tsx --test backend/tests/account-classification.integration.ts

      - name: Authentication, ownership and session isolation (real MariaDB)
        env:
          AUTH_INTEGRATION: '1'
          AUTH_INTEGRATION_DATABASE_CONFIRM: isolated
        run: node --import tsx --test backend/src/auth/integration.test.ts

      - name: Phase18 aggregate invalidation and recent-buy equivalence (real MariaDB)
        run: node --import tsx --test backend/tests/phase18.integration.ts

      - name: Phase33 stock news storage, schedule and account pagination (real MariaDB)
        run: |
          node --import tsx --test backend/tests/stock-news.integration.ts
          node --import tsx --test backend/tests/news-schedule.integration.ts

      - name: Phase32 remaining recent buy Lots (real MariaDB API)
        run: node --import tsx --test backend/tests/home-phase32.integration.ts

      - name: Realtime lifecycle ownership and snapshot conflict (real MariaDB)
        run: node --import tsx --test collector/tests/realtime-lifecycle.integration.ts

      - name: Changed compound-plan real database functions
        run: node --import tsx --test backend/tests/compound-growth.integration.ts

      - name: Asset analysis stored-data integration
        run: node --import tsx --test backend/tests/asset-analysis.integration.ts

      - name: Security data collection, edit preservation and admin API integration
        run: node --import tsx --test backend/tests/security-data.integration.ts

      - name: Manual collector source and period API integration
        run: node --import tsx --test backend/tests/manual-collector.integration.ts backend/tests/manual-independent.integration.ts

      - name: Cash12 latest balance and concurrent writes (real MariaDB API)
        run: node --import tsx --test backend/tests/cash-latest.integration.ts

      - name: DART recovery on isolated real MariaDB
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/roxstock_dart_recovery_test
        run: |
          node --import tsx backend/tests/prepare-dart-recovery.ts
          node --import tsx --test --test-concurrency=1 collector/tests/dart-recovery.integration.ts collector/tests/dart-source-validation.integration.ts

      - name: Verify migration status
        run: npx prisma migrate status --schema database/prisma/schema.prisma

      - name: Account reset and deletion on isolated MariaDB
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/roxstock_phase15_test
        run: |
          node --import tsx backend/tests/prepare-accounts-phase15.ts
          node --import tsx --test backend/tests/accounts-phase15.integration.ts

      - name: Type-check backend
        run: npm run typecheck:backend

      - name: Safe collector diagnostic filter
        run: node --test scripts/tests/collector-diagnostics.test.mjs

      - name: Test backend
        run: npm --workspace backend run test

      - name: Real user authentication and ownership boundary
        env:
          AUTH_INTEGRATION: '1'
          AUTH_INTEGRATION_DATABASE_CONFIRM: isolated
        run: node --import tsx --test backend/src/auth/integration.test.ts


      - name: Build backend
        run: npm run build:backend

      - name: Independent production API image and startup boundary
        run: |
          docker build -f backend/Dockerfile -t roxstock-api-check .
          docker run --rm --entrypoint sh roxstock-api-check -c 'test ! -d /app/collector/dist; test ! -d /app/backend/dist/collector'
          docker run -d --name api-entry-check --network none -e DATABASE_URL=mysql://ci:ci@127.0.0.1:3306/ci roxstock-api-check
          sleep 5
          docker exec api-entry-check node -e "fetch('http://127.0.0.1:3300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          docker stop -t 30 api-entry-check
          test "$(docker inspect --format '{{.State.ExitCode}}' api-entry-check)" = 0
