name: Improvements phase 4
on:
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/improvements-phase4-check.yml']
permissions:
  contents: read
jobs:
  phase4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:frontend && npm run build:frontend
      - run: node --import tsx --test frontend/tests/unit/*.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.phase4.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: improvements-phase4-evidence
          path: frontend/test-results/phase4
          retention-days: 7
