name: Settings Update Check (requested screen only)
on:
  pull_request:
    branches: [main]
    paths: [frontend/**, .github/workflows/settings-update-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  settings:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'codex/settings-v03-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --workspace frontend --include-workspace-root=false
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test --config=playwright.targets.config.ts settings-v03.spec.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-scoped-check
          path: frontend/test-results/targets/
          retention-days: 3
