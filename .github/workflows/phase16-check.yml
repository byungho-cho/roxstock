name: Navigation and trade flow phase 16
on:
  pull_request:
    branches: [main]
    paths: [frontend/**, backend/**, .github/workflows/phase16-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql://roxstock:roxstock@127.0.0.1:3306/roxstock_phase16_test
    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: roxstock_phase16_test
          MARIADB_USER: roxstock
          MARIADB_PASSWORD: roxstock
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate && npm run prisma:migrate:deploy
      - run: node --import tsx --test backend/tests/phase16.integration.ts
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test -c playwright.phase16.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase16-screenshots
          path: frontend/test-results/phase16/
          retention-days: 14
