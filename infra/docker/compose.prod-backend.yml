services:
  backend:
    image: newrox/roxstock-backend:${BACKEND_IMAGE_TAG:?Set BACKEND_IMAGE_TAG to a sha-commit tag}
    container_name: roxstock-backend
    restart: unless-stopped
    env_file:
      - ../../backend/.env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3300
    expose:
      - "3300"
    networks:
      - app
      - db
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3300/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  collector:
    image: newrox/roxstock-backend:${BACKEND_IMAGE_TAG:?Set BACKEND_IMAGE_TAG to a sha-commit tag}
    container_name: roxstock-collector
    restart: unless-stopped
    env_file:
      - ../../backend/.env.production
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      COLLECTOR_PRICE_COLLECTION_HOUR: ${COLLECTOR_PRICE_COLLECTION_HOUR:-20}
      COLLECTOR_PRICE_RETRY_DELAY_MINUTES: ${COLLECTOR_PRICE_RETRY_DELAY_MINUTES:-60}
      COLLECTOR_SNAPSHOT_HOURS: ${COLLECTOR_SNAPSHOT_HOURS:-23}
      COLLECTOR_LOCK_TTL_SECONDS: ${COLLECTOR_LOCK_TTL_SECONDS:-7200}
    command: ["node", "backend/dist/collector/worker.js", "daemon"]
    networks:
      - db
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').readFileSync('/proc/1/cmdline','utf8').includes('worker.js')||process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  realtime-collector:
    image: newrox/roxstock-backend:${BACKEND_IMAGE_TAG:?Set BACKEND_IMAGE_TAG to a sha-commit tag}
    container_name: roxstock-realtime-collector
    restart: unless-stopped
    env_file:
      - ../../backend/.env.production
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      COLLECTOR_REALTIME_ENABLED: ${COLLECTOR_REALTIME_ENABLED:-true}
      COLLECTOR_REALTIME_INTERVAL_SECONDS: ${COLLECTOR_REALTIME_INTERVAL_SECONDS:-60}
      COLLECTOR_REALTIME_DB_FLUSH_SECONDS: ${COLLECTOR_REALTIME_DB_FLUSH_SECONDS:-60}
      COLLECTOR_REALTIME_TARGET_REFRESH_SECONDS: ${COLLECTOR_REALTIME_TARGET_REFRESH_SECONDS:-30}
      COLLECTOR_REALTIME_STALE_BACKOFF_SECONDS: ${COLLECTOR_REALTIME_STALE_BACKOFF_SECONDS:-300}
      COLLECTOR_REALTIME_MAX_SECURITIES: ${COLLECTOR_REALTIME_MAX_SECURITIES:-100}
      COLLECTOR_REALTIME_CONCURRENCY: ${COLLECTOR_REALTIME_CONCURRENCY:-5}
      COLLECTOR_REALTIME_PRE_MARKET_OPEN: ${COLLECTOR_REALTIME_PRE_MARKET_OPEN:-08:00}
      COLLECTOR_REALTIME_PRE_MARKET_CLOSE: ${COLLECTOR_REALTIME_PRE_MARKET_CLOSE:-08:50}
      COLLECTOR_REALTIME_REGULAR_MARKET_OPEN: ${COLLECTOR_REALTIME_REGULAR_MARKET_OPEN:-09:00}
      COLLECTOR_REALTIME_REGULAR_MARKET_CLOSE: ${COLLECTOR_REALTIME_REGULAR_MARKET_CLOSE:-15:30}
      COLLECTOR_REALTIME_AFTER_MARKET_OPEN: ${COLLECTOR_REALTIME_AFTER_MARKET_OPEN:-15:40}
      COLLECTOR_REALTIME_AFTER_MARKET_CLOSE: ${COLLECTOR_REALTIME_AFTER_MARKET_CLOSE:-20:00}
      COLLECTOR_REALTIME_API_URL: http://backend:3300/internal/realtime-prices
    command: ["node", "backend/dist/collector/realtime-worker.js"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
      - db
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').readFileSync('/proc/1/cmdline','utf8').includes('realtime-worker.js')||process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app:
    external: true
    name: roxstock_app
  db:
    external: true
    name: roxstock-db_default
