services:
  backend:
    image: newrox/roxstock-backend:${BACKEND_IMAGE_TAG:?Set BACKEND_IMAGE_TAG to a sha-commit tag}
    container_name: roxstock-backend
    restart: unless-stopped
    env_file:
      - ../../backend/.env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3300
    expose:
      - "3300"
    networks:
      - app
      - db
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3300/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  app:
    external: true
    name: roxstock_app
  db:
    external: true
    name: roxstock-db_default
