services:
  backend:
    image: ${BACKEND_IMAGE:?Set an immutable BACKEND_IMAGE}
    container_name: roxstock-backend
    restart: unless-stopped
    env_file:
      - ../../backend/.env.production
      # Authentication mail secrets belong only to the backend, never collector services.
      - ../../backend/.env.auth
    environment:
      NODE_ENV: production
      SECURITY_DATA_COLLECTION_ENABLED: ${SECURITY_DATA_COLLECTION_ENABLED:-true}
      ROXSTOCK_RELEASE_FILE: /run/roxstock/release.json
      HOST: 0.0.0.0
      PORT: 3300
      # Enable flags and the admin hash come only from the private env_file.
      # Missing flags remain disabled in the service; do not override them here.
      BACKUP_DIRECTORY: /var/lib/roxstock/backups
      BACKUP_PUBLIC_ORIGIN: https://newrox.cafe24.com
      DART_BACKFILL_DAILY_CALL_LIMIT: ${DART_BACKFILL_DAILY_CALL_LIMIT:-10000}
      DART_BACKFILL_MIN_DELAY_MS: ${DART_BACKFILL_MIN_DELAY_MS:-2000}
      DART_DAILY_CALL_LIMIT: ${DART_DAILY_CALL_LIMIT:-10000}
      DART_REST_DAY_ALL_DAY: ${DART_REST_DAY_ALL_DAY:-true}
      DART_PUBLIC_HOLIDAYS: ${DART_PUBLIC_HOLIDAYS:-}
      # The current Cafe24 deployment is a disposable development/test server.
      # Change to false or remove this override before production use.
      ENABLE_ACCOUNT_DATA_RESET: ${ENABLE_ACCOUNT_DATA_RESET:-true}
    volumes:
      - ${ROXSTOCK_RUNTIME_DIR:-/opt/roxstock/.deploy/runtime}:/run/roxstock:ro
      - ${ROXSTOCK_MANAGED_BACKUP_DIR:-/opt/roxstock/backups/managed}:/var/lib/roxstock/backups
    expose:
      - "3300"
    networks:
      - app
      - db
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3300/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  collector:
    image: ${COLLECTOR_IMAGE:?Set an immutable COLLECTOR_IMAGE}
    container_name: roxstock-collector
    restart: unless-stopped
    stop_grace_period: 720s
    env_file:
      - ../../backend/.env.production
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      SECURITY_DATA_COLLECTION_ENABLED: ${SECURITY_DATA_COLLECTION_ENABLED:-true}
      KIS_TOKEN_CACHE_DIR: /var/lib/roxstock/kis-tokens
      COLLECTOR_SECURITY_MASTER_HOUR: ${COLLECTOR_SECURITY_MASTER_HOUR:-6}
      COLLECTOR_PRICE_COLLECTION_HOUR: ${COLLECTOR_PRICE_COLLECTION_HOUR:-20}
      COLLECTOR_PRICE_RETRY_DELAY_MINUTES: ${COLLECTOR_PRICE_RETRY_DELAY_MINUTES:-60}
      COLLECTOR_SNAPSHOT_HOURS: ${COLLECTOR_SNAPSHOT_HOURS:-23}
      COLLECTOR_LOCK_TTL_SECONDS: ${COLLECTOR_LOCK_TTL_SECONDS:-7200}
    command: ["node", "${COLLECTOR_ENTRY_ROOT:-collector/dist}/worker.js", "daemon"]
    volumes:
      - kis-token-cache:/var/lib/roxstock/kis-tokens
    networks:
      - db
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').readFileSync('/proc/1/cmdline','utf8').includes('worker.js')||process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  realtime-collector:
    image: ${COLLECTOR_IMAGE:?Set an immutable COLLECTOR_IMAGE}
    container_name: roxstock-realtime-collector
    restart: unless-stopped
    stop_grace_period: 720s
    env_file:
      - ../../backend/.env.production
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      COLLECTOR_REALTIME_ENABLED: ${COLLECTOR_REALTIME_ENABLED:-true}
      COLLECTOR_REALTIME_INTERVAL_SECONDS: ${COLLECTOR_REALTIME_INTERVAL_SECONDS:-60}
      COLLECTOR_REALTIME_DB_FLUSH_SECONDS: ${COLLECTOR_REALTIME_DB_FLUSH_SECONDS:-60}
      COLLECTOR_REALTIME_TARGET_REFRESH_SECONDS: ${COLLECTOR_REALTIME_TARGET_REFRESH_SECONDS:-30}
      COLLECTOR_REALTIME_STALE_BACKOFF_SECONDS: ${COLLECTOR_REALTIME_STALE_BACKOFF_SECONDS:-300}
      COLLECTOR_REALTIME_MAX_SECURITIES: ${COLLECTOR_REALTIME_MAX_SECURITIES:-100}
      COLLECTOR_REALTIME_CONCURRENCY: ${COLLECTOR_REALTIME_CONCURRENCY:-5}
      COLLECTOR_REALTIME_PRE_MARKET_OPEN: ${COLLECTOR_REALTIME_PRE_MARKET_OPEN:-08:00}
      COLLECTOR_REALTIME_PRE_MARKET_CLOSE: ${COLLECTOR_REALTIME_PRE_MARKET_CLOSE:-08:50}
      COLLECTOR_REALTIME_REGULAR_MARKET_OPEN: ${COLLECTOR_REALTIME_REGULAR_MARKET_OPEN:-09:00}
      COLLECTOR_REALTIME_REGULAR_MARKET_CLOSE: ${COLLECTOR_REALTIME_REGULAR_MARKET_CLOSE:-15:30}
      COLLECTOR_REALTIME_AFTER_MARKET_OPEN: ${COLLECTOR_REALTIME_AFTER_MARKET_OPEN:-15:40}
      COLLECTOR_REALTIME_AFTER_MARKET_CLOSE: ${COLLECTOR_REALTIME_AFTER_MARKET_CLOSE:-20:00}
      COLLECTOR_REALTIME_API_URL: http://backend:3300/internal/realtime-prices
    command: ["node", "${COLLECTOR_ENTRY_ROOT:-collector/dist}/realtime-worker.js"]
    networks:
      - app
      - db
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').readFileSync('/proc/1/cmdline','utf8').includes('realtime-worker.js')||process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dart-collector:
    image: ${COLLECTOR_IMAGE:?Set an immutable COLLECTOR_IMAGE}
    container_name: roxstock-dart-collector
    restart: unless-stopped
    stop_grace_period: 720s
    env_file:
      - ../../backend/.env.production
    environment:
      NODE_ENV: production
      TZ: Asia/Seoul
      KIS_TOKEN_CACHE_DIR: /var/lib/roxstock/kis-tokens
      DART_COLLECTOR_ENABLED: ${DART_COLLECTOR_ENABLED:-true}
      SECURITY_DATA_COLLECTION_ENABLED: ${SECURITY_DATA_COLLECTION_ENABLED:-true}
      SECURITY_DATA_INTERVAL_MINUTES: ${SECURITY_DATA_INTERVAL_MINUTES:-60}
      SECURITY_DATA_RETRY_MINUTES: ${SECURITY_DATA_RETRY_MINUTES:-60}
      SECURITY_DATA_MAX_ATTEMPTS: ${SECURITY_DATA_MAX_ATTEMPTS:-3}
      SECURITY_DATA_BATCH_SIZE: ${SECURITY_DATA_BATCH_SIZE:-20}
      DART_DAILY_CALL_LIMIT: ${DART_DAILY_CALL_LIMIT:-10000}
      DART_MIN_DELAY_MS: ${DART_MIN_DELAY_MS:-5000}
      DART_BACKFILL_DAILY_CALL_LIMIT: ${DART_BACKFILL_DAILY_CALL_LIMIT:-10000}
      DART_BACKFILL_MIN_DELAY_MS: ${DART_BACKFILL_MIN_DELAY_MS:-2000}
      DART_REST_DAY_ALL_DAY: ${DART_REST_DAY_ALL_DAY:-true}
      DART_PUBLIC_HOLIDAYS: ${DART_PUBLIC_HOLIDAYS:-}
      DART_BACKFILL_START_YEAR: ${DART_BACKFILL_START_YEAR:-2015}
      DART_BACKFILL_COMPANY_LIMIT: ${DART_BACKFILL_COMPANY_LIMIT:-250}
      DART_UNIVERSE_DAILY_COMPANIES: ${DART_UNIVERSE_DAILY_COMPANIES:-35}
      DART_PRIORITY_WINDOW_START_HOUR: ${DART_PRIORITY_WINDOW_START_HOUR:-16}
      DART_PRIORITY_WINDOW_END_HOUR: ${DART_PRIORITY_WINDOW_END_HOUR:-6}
      DART_NIGHT_WINDOW_START_HOUR: ${DART_NIGHT_WINDOW_START_HOUR:-18}
      DART_NIGHT_WINDOW_END_HOUR: ${DART_NIGHT_WINDOW_END_HOUR:-6}
      DART_CORP_CODE_REFRESH_HOURS: ${DART_CORP_CODE_REFRESH_HOURS:-24}
    command: ["node", "${COLLECTOR_ENTRY_ROOT:-collector/dist}/dart-worker.js"]
    volumes:
      - kis-token-cache:/var/lib/roxstock/kis-tokens
    networks:
      - db
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').readFileSync('/proc/1/cmdline','utf8').includes('dart-worker.js')||process.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app:
    external: true
    name: roxstock_app
  db:
    external: true
    name: roxstock-db_default


volumes:
  kis-token-cache:
    name: roxstock-kis-token-cache
