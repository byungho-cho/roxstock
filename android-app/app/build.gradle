plugins { id 'com.android.application' }

def site = providers.gradleProperty('roxstockUrl').getOrElse('https://newrox.cafe24.com')
if (!(site ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?/)) throw new GradleException('roxstockUrl must be an HTTPS origin without a path')

android {
    namespace 'com.roxstock.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.roxstock.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'SITE_ORIGIN', '"' + site + '"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-test' }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
