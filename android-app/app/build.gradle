plugins { id 'com.android.application' }

def site = providers.gradleProperty('roxstockUrl').getOrElse('https://newrox.cafe24.com')
if (!(site ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?/)) throw new GradleException('roxstockUrl must be an HTTPS origin without a path')

android {
    namespace 'com.roxstock.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.roxstock.app'
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName '0.1.8'
        resValue 'string', 'app_name', 'RoxStock'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ['APP_ID','API_KEY','PROJECT_ID','SENDER_ID'].each { key ->
            buildConfigField 'String', 'FCM_' + key, '""'
        }
        buildConfigField 'String', 'SITE_ORIGIN', '"' + site + '"'
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'capability'
    productFlavors {
        webOnly {
            dimension 'capability'
            applicationIdSuffix '.webonly'
            versionNameSuffix '-webonly'
            resValue 'string', 'app_name', 'RoxStock 웹'
        }
        notifications {
            dimension 'capability'
            def keys = ['APP_ID','API_KEY','PROJECT_ID','SENDER_ID']
            def values = keys.collect { System.getenv('ROXSTOCK_FCM_' + it) ?: '' }
            if (values.any { it } && !values.every { it }) throw new GradleException('Incomplete Firebase client configuration')
            keys.eachWithIndex { key, index ->
                def value = values[index]
                if (!(value ==~ /[A-Za-z0-9_:.\-]*/)) throw new GradleException('Invalid Firebase client configuration')
                buildConfigField 'String', 'FCM_' + key, '"' + value + '"'
            }
        }
    }
    signingConfigs {
        if (System.getenv('ROXSTOCK_SIGNING_KEYSTORE')) {
            stable {
                storeFile file(System.getenv('ROXSTOCK_SIGNING_KEYSTORE'))
                storePassword System.getenv('ROXSTOCK_SIGNING_PASSWORD')
                keyAlias 'roxstock'
                keyPassword System.getenv('ROXSTOCK_SIGNING_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            if (System.getenv('ROXSTOCK_SIGNING_KEYSTORE')) signingConfig signingConfigs.stable
        }
        release {
            // Preserve the installed, approved package identity for in-place updates.
            applicationIdSuffix '.debug'
            debuggable false
            minifyEnabled false
            if (System.getenv('ROXSTOCK_SIGNING_KEYSTORE')) signingConfig signingConfigs.stable
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
dependencies {
    notificationsImplementation 'com.google.firebase:firebase-messaging:24.1.2'
    notificationsImplementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
